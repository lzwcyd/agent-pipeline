# headless profile: one-shot DSH agent runs driven by the pipeline gateway.
# `dsh --profile headless "<task>"` 提交一个任务，等待 agent 静默后把最后一条
# assistant 文本输出到 stdout（成功退出码 0）。
#
# 真实工程模式：把沙箱 workspaceRoot 放宽到网关工作区（data/ 根，含真实工程目录
# data/workspace/<project>/），由网关启动时设置 PIPELINE_WORKSPACE_ROOT 注入。
- id: sandbox-policy
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.env.PIPELINE_WORKSPACE_ROOT ?? process.cwd()

- id: fs-sandbox
  config:
    cwd: !!js process.env.PIPELINE_WORKSPACE_ROOT ?? process.cwd()
